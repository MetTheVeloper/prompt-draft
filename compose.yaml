services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_API_BASE_INTERNAL: http://api:4000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:4000}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/guide').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030,http://127.0.0.1:3030,http://localhost:3000,http://127.0.0.1:3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: prompt_draft
      DB_USER: prompt_draft
      DB_PASSWORD: prompt_draft_dev
      TRANSLATION_BASE_URL: http://translator:5000
      TRANSLATION_TIMEOUT_MS: 20000
      ARCHIVE_SOURCE_ROOT: /archive-source
      ARCHIVE_SNAPSHOT_OUTPUT_ROOT: /archive-output
      ARCHIVE_S3_ENDPOINT: ${ARCHIVE_S3_ENDPOINT:-}
      ARCHIVE_S3_REGION: ${ARCHIVE_S3_REGION:-}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_S3_PUBLIC_BASE_URL: ${ARCHIVE_S3_PUBLIC_BASE_URL:-}
      ARCHIVE_S3_FORCE_PATH_STYLE: ${ARCHIVE_S3_FORCE_PATH_STYLE:-true}
      ARCHIVE_S3_OBJECT_ACL: ${ARCHIVE_S3_OBJECT_ACL:-public-read}
      ARCHIVE_S3_ACCESS_KEY_ID: ${ARCHIVE_S3_ACCESS_KEY_ID:-}
      ARCHIVE_S3_SECRET_ACCESS_KEY: ${ARCHIVE_S3_SECRET_ACCESS_KEY:-}
      ARCHIVE_S3_SMOKE_PUBLIC_READ: ${ARCHIVE_S3_SMOKE_PUBLIC_READ:-false}
    volumes:
      - ./public:/archive-source/public:ro
      - ./public:/archive-output/public
      - ./i18n/locales:/archive-source/i18n/locales:ro
    depends_on:
      db:
        condition: service_healthy
      translator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/db-check').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  translator:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: en,fa
      LT_CHAR_LIMIT: 5000
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - prompt_draft_translation_models:/home/libretranslate/.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prompt_draft
      POSTGRES_USER: prompt_draft
      POSTGRES_PASSWORD: prompt_draft_dev
    volumes:
      - prompt_draft_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_draft -d prompt_draft"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  prompt_draft_pgdata:
  prompt_draft_translation_models:
