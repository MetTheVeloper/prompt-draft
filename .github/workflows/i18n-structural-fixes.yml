name: Apply multilingual structural fixes

on:
  push:
    branches:
      - feat/i18n-multilingual
    paths:
      - .github/workflows/i18n-structural-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply structural patch
        run: python scripts/_i18n-structural-patch.py

      - name: Validate locale structure
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate
          pnpm install --frozen-lockfile
          pnpm i18n:validate
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app package.json scripts/validate-i18n.ts docs/i18n.md
          git rm scripts/_i18n-structural-patch.py
          git rm .github/workflows/i18n-structural-fixes.yml
          git commit -m "refactor(i18n): make locale behavior multilingual"
          git push origin HEAD:feat/i18n-multilingual
