name: Apply multilingual structural fixes

on:
  push:
    branches:
      - feat/i18n-multilingual
    paths:
      - .github/workflows/i18n-structural-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct patch script and apply it
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_i18n-structural-patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'replace("app/pages/create.vue", \'locale.value === "fa" ? "fa-IR" : "en-US",\', \'localeLanguage.value,\', 1)',
              'replace("app/pages/create.vue", \'locale.value === "fa" ? "fa-IR" : "en-US",\', \'localeLanguage.value,\', 2)',
              1,
          )
          obsolete = '''replace(
              "app/pages/create.vue",
              'date.toLocaleTimeString(locale.value === "fa" ? "fa-IR" : "en-US", {',
              'date.toLocaleTimeString(localeLanguage.value, {',
              1,
          )
          '''
          if obsolete not in text:
              raise SystemExit('obsolete create date patch block not found')
          path.write_text(text.replace(obsolete, '', 1), encoding='utf-8')
          PY
          python scripts/_i18n-structural-patch.py

      - name: Validate locale structure
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate
          pnpm install --frozen-lockfile
          pnpm i18n:validate
          git diff --check

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app package.json scripts/validate-i18n.ts docs/i18n.md
          git rm scripts/_i18n-structural-patch.py
          git rm .github/workflows/i18n-structural-fixes.yml
          git commit -m "refactor(i18n): make locale behavior multilingual"
          git push origin HEAD:feat/i18n-multilingual
