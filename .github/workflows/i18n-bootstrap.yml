name: Bootstrap multilingual locales

on:
  push:
    branches:
      - feat/i18n-multilingual
    paths:
      - .github/workflows/i18n-bootstrap.yml

permissions:
  contents: write

jobs:
  translate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh
            model: Helsinki-NLP/opus-mt-en-zh
            prefix: ">>cmn_Hans<< "
          - locale: ar
            model: Helsinki-NLP/opus-mt-en-ar
            prefix: ">>ara<< "
          - locale: ru
            model: Helsinki-NLP/opus-mt-en-ru
            prefix: ""
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export English locale to JSON
        run: |
          npx --yes tsx@4.22.4 -e "import en from './i18n/locales/en.ts'; process.stdout.write(JSON.stringify(en))" > /tmp/en.json

      - name: Install translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.49.0" sentencepiece sacremoses

      - name: Translate locale
        env:
          TARGET_LOCALE: ${{ matrix.locale }}
          MODEL_NAME: ${{ matrix.model }}
          TARGET_PREFIX: ${{ matrix.prefix }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import OrderedDict
          from pathlib import Path

          import torch
          from transformers import MarianMTModel, MarianTokenizer

          target = os.environ['TARGET_LOCALE']
          model_name = os.environ['MODEL_NAME']
          target_prefix = os.environ.get('TARGET_PREFIX', '')

          with open('/tmp/en.json', 'r', encoding='utf-8') as fh:
              source = json.load(fh, object_pairs_hook=OrderedDict)

          # Interpolation variables, brand names, keyboard shortcuts and technical
          # acronyms must survive translation byte-for-byte.
          protected_re = re.compile(
              r'(\{[^{}]+\}|Prompt Draft|Ctrl/⌘ \+ V|WebM|iOS|'
              r'\b[A-Z][A-Z0-9]{1,}(?:[-+./][A-Z0-9]+)*\b)'
          )

          def split_protected(text):
              return protected_re.split(text)

          def is_protected(text):
              return bool(text) and protected_re.fullmatch(text) is not None

          def translatable_core(text):
              if not text or is_protected(text):
                  return None
              match = re.fullmatch(r'(\s*)(.*?)(\s*)', text, re.S)
              if not match:
                  return None
              core = match.group(2)
              if not re.search(r'[A-Za-z]', core):
                  return None
              return core

          paths = []
          unique_cores = OrderedDict()

          def collect(value, path=()):
              if isinstance(value, str):
                  parts = split_protected(value)
                  paths.append((path, parts))
                  for part in parts:
                      core = translatable_core(part)
                      if core is not None:
                          unique_cores.setdefault(core, None)
                  return
              if isinstance(value, dict):
                  for key, child in value.items():
                      collect(child, path + (key,))

          collect(source)
          cores = list(unique_cores.keys())
          print(f'{target}: {len(paths)} strings, {len(cores)} unique translatable segments')

          tokenizer = MarianTokenizer.from_pretrained(model_name)
          model = MarianMTModel.from_pretrained(model_name)
          model.eval()
          torch.set_num_threads(max(1, min(4, os.cpu_count() or 2)))

          translated = {}
          batch_size = 32

          with torch.inference_mode():
              for start in range(0, len(cores), batch_size):
                  batch = cores[start:start + batch_size]
                  model_input = [f'{target_prefix}{text}' for text in batch]
                  encoded = tokenizer(
                      model_input,
                      return_tensors='pt',
                      padding=True,
                      truncation=True,
                      max_length=512,
                  )
                  generated = model.generate(
                      **encoded,
                      max_length=512,
                      num_beams=2,
                      early_stopping=True,
                  )
                  output = tokenizer.batch_decode(generated, skip_special_tokens=True)
                  for original, result in zip(batch, output):
                      translated[original] = result.strip() or original

                  done = min(start + batch_size, len(cores))
                  if done % 320 == 0 or done == len(cores):
                      print(f'{target}: translated {done}/{len(cores)} segments')

          def rebuild(value):
              if isinstance(value, str):
                  result = []
                  for part in split_protected(value):
                      if is_protected(part):
                          result.append(part)
                          continue

                      match = re.fullmatch(r'(\s*)(.*?)(\s*)', part, re.S)
                      if not match:
                          result.append(part)
                          continue

                      lead, core, trail = match.groups()
                      if core in translated:
                          result.append(f'{lead}{translated[core]}{trail}')
                      else:
                          result.append(part)
                  return ''.join(result)

              if isinstance(value, dict):
                  return OrderedDict((key, rebuild(child)) for key, child in value.items())

              if isinstance(value, list):
                  return [rebuild(child) for child in value]

              return value

          result = rebuild(source)

          # Hand-tuned high-visibility UI terms. Long-form module/guide copy remains
          # model-translated from en.ts, while these core labels stay predictable.
          overrides = {
              'zh': {
                  'app.navigation.create': '创建',
                  'app.navigation.collage': '拼贴',
                  'app.navigation.guide': '指南',
                  'app.navigation.vectorizer': '矢量化',
                  'app.navigation.prompts': '提示词',
                  'app.switchTheme': '切换主题',
                  'app.switchLang': '切换语言',
                  'app.tools.menu': '更多工具',
                  'app.tools.convert': '转换',
                  'app.tools.about': '关于',
                  'validation.title': '需要注意',
                  'validation.level.error': '错误',
                  'validation.level.warning': '警告',
              },
              'ar': {
                  'app.navigation.create': 'إنشاء',
                  'app.navigation.collage': 'كولاج',
                  'app.navigation.guide': 'الدليل',
                  'app.navigation.vectorizer': 'تحويل إلى متجهات',
                  'app.navigation.prompts': 'الأوامر',
                  'app.switchTheme': 'تبديل السمة',
                  'app.switchLang': 'تبديل اللغة',
                  'app.tools.menu': 'المزيد من الأدوات',
                  'app.tools.convert': 'تحويل',
                  'app.tools.about': 'حول',
                  'validation.title': 'يتطلب الانتباه',
                  'validation.level.error': 'خطأ',
                  'validation.level.warning': 'تحذير',
              },
              'ru': {
                  'app.navigation.create': 'Создать',
                  'app.navigation.collage': 'Коллаж',
                  'app.navigation.guide': 'Руководство',
                  'app.navigation.vectorizer': 'Векторизатор',
                  'app.navigation.prompts': 'Промпты',
                  'app.switchTheme': 'Сменить тему',
                  'app.switchLang': 'Сменить язык',
                  'app.tools.menu': 'Другие инструменты',
                  'app.tools.convert': 'Конвертировать',
                  'app.tools.about': 'О приложении',
                  'validation.title': 'Требует внимания',
                  'validation.level.error': 'Ошибка',
                  'validation.level.warning': 'Предупреждение',
              },
          }

          def set_path(obj, dotted, value):
              node = obj
              parts = dotted.split('.')
              for part in parts[:-1]:
                  node = node[part]
              node[parts[-1]] = value

          for dotted, value in overrides[target].items():
              set_path(result, dotted, value)

          output_path = Path(f'i18n/locales/{target}.ts')
          output_path.write_text(
              'export default ' + json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # Guard interpolation tokens at generation time.
          placeholder_re = re.compile(r'\{[^{}]+\}')

          def flatten(value, path=(), out=None):
              if out is None:
                  out = {}
              if isinstance(value, str):
                  out['.'.join(path)] = value
              elif isinstance(value, dict):
                  for key, child in value.items():
                      flatten(child, path + (key,), out)
              return out

          src_flat = flatten(source)
          dst_flat = flatten(result)
          errors = []
          for key, src_text in src_flat.items():
              src_tokens = sorted(placeholder_re.findall(src_text))
              dst_tokens = sorted(placeholder_re.findall(dst_flat[key]))
              if src_tokens != dst_tokens:
                  errors.append((key, src_tokens, dst_tokens))

          if errors:
              for error in errors[:20]:
                  print('placeholder mismatch:', error)
              raise SystemExit(f'{target}: {len(errors)} placeholder mismatches')

          print(f'{target}: wrote {output_path} ({output_path.stat().st_size} bytes)')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.locale }}
          path: i18n/locales/${{ matrix.locale }}.ts
          if-no-files-found: error

  integrate:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          path: /tmp/locales
          merge-multiple: true

      - name: Integrate locale files and Arabic font stack
        run: |
          cp /tmp/locales/zh.ts i18n/locales/zh.ts
          cp /tmp/locales/ar.ts i18n/locales/ar.ts
          cp /tmp/locales/ru.ts i18n/locales/ru.ts

          python - <<'PY'
          from pathlib import Path
          path = Path('app/assets/css/app.scss')
          text = path.read_text(encoding='utf-8')
          old = "html[lang='fa'] {\n  --app-font-family: 'persian', 'Vazirmatn', system-ui, sans-serif;\n}"
          new = "html[lang='fa'],\nhtml[lang='ar'] {\n  --app-font-family: 'persian', 'Vazirmatn', system-ui, sans-serif;\n}"
          if old not in text:
              raise SystemExit('Persian font selector not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate locale keys and interpolation tokens
        run: |
          npx tsx - <<'TS'
          import en from './i18n/locales/en.ts'
          import zh from './i18n/locales/zh.ts'
          import ar from './i18n/locales/ar.ts'
          import ru from './i18n/locales/ru.ts'

          const flatten = (value: any, prefix = '', out: Record<string, string> = {}) => {
            for (const [key, child] of Object.entries(value)) {
              const path = prefix ? `${prefix}.${key}` : key
              if (typeof child === 'string') out[path] = child
              else if (child && typeof child === 'object') flatten(child, path, out)
            }
            return out
          }

          const source = flatten(en)
          const tokenRe = /\{[^{}]+\}/g

          for (const [code, messages] of Object.entries({ zh, ar, ru })) {
            const target = flatten(messages)
            const missing = Object.keys(source).filter(key => !(key in target))
            const extra = Object.keys(target).filter(key => !(key in source))
            const placeholderErrors = Object.keys(source).filter(key => {
              const a = [...(source[key].match(tokenRe) || [])].sort().join('|')
              const b = [...((target[key] || '').match(tokenRe) || [])].sort().join('|')
              return a !== b
            })

            console.log(`${code}: ${Object.keys(target).length} strings`)
            if (missing.length || extra.length || placeholderErrors.length) {
              console.error({ code, missing: missing.slice(0, 20), extra: extra.slice(0, 20), placeholderErrors: placeholderErrors.slice(0, 20) })
              process.exitCode = 1
            }
          }
          TS

      - name: Audit locale-specific assumptions
        run: |
          echo 'Potential binary locale assumptions:'
          grep -RInE "locale(\.value)?[[:space:]]*(===|!==)[[:space:]]*['\"](en|fa)['\"]|normalizedLocale[[:space:]]*===[[:space:]]*['\"]fa['\"]" app --include='*.vue' --include='*.ts' || true

      - name: Generate application
        run: pnpm generate

      - name: Commit multilingual locale implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/locales/zh.ts i18n/locales/ar.ts i18n/locales/ru.ts app/assets/css/app.scss
          git rm .github/workflows/i18n-bootstrap.yml
          git commit -m "feat(i18n): add Chinese Arabic and Russian translations"
          git push origin HEAD:feat/i18n-multilingual
