name: Temporary Wizard Regression

on:
  push:
    branches:
      - feature/wizard

permissions:
  contents: read

jobs:
  wizard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Wizard regression
        run: pnpm test:wizard
