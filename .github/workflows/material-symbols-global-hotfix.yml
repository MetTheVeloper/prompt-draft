name: Material Symbols global hotfix

on:
  push:
    branches:
      - feat/material-symbols-migration
    paths:
      - .github/workflows/material-symbols-global-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Audit and patch legacy icon identifiers across app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app')
          files = [p for p in root.rglob('*') if p.suffix in {'.vue', '.ts', '.js', '.tsx', '.jsx'}]

          replacements = {
              'minus': 'remove',
              'document-copy': 'content_copy',
              'tick': 'check',
              'video-play': 'play_circle',
              'gallery': 'image',
              'sun-1': 'light_mode',
              'moon': 'dark_mode',
          }

          # Direct icon properties/attributes, e.g. icon: 'gallery' or icon="minus".
          direct_re = re.compile(
              r"(?P<prefix>(?:\bicon\s*:\s*|\bicon\s*=\s*))(?P<q>['\"])(?P<name>[^'\"]+)(?P=q)"
          )
          # Vue bound icon expression. Replace legacy literals inside the expression only.
          bound_re = re.compile(r':icon\s*=\s*(?P<q>["\'])(?P<expr>.*?)(?P=q)')
          literal_re = re.compile(r"(?P<q>['\"])(?P<name>minus|document-copy|tick|video-play|gallery|sun-1|moon)(?P=q)")

          changed = []
          hits = []

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              def direct_sub(m):
                  name = m.group('name')
                  if name not in replacements:
                      return m.group(0)
                  hits.append((str(path), name, replacements[name], 'direct'))
                  return f"{m.group('prefix')}{m.group('q')}{replacements[name]}{m.group('q')}"

              text = direct_re.sub(direct_sub, text)

              def bound_sub(m):
                  expr = m.group('expr')
                  def lit_sub(lm):
                      name = lm.group('name')
                      hits.append((str(path), name, replacements[name], 'bound'))
                      return f"{lm.group('q')}{replacements[name]}{lm.group('q')}"
                  new_expr = literal_re.sub(lit_sub, expr)
                  return f":icon={m.group('q')}{new_expr}{m.group('q')}"

              text = bound_re.sub(bound_sub, text)

              # Legacy toggle helpers can return an icon id from a function whose name is Symbol/Icon.
              lines = text.splitlines(keepends=True)
              current_icon_helper = False
              brace_depth = 0
              for i, line in enumerate(lines):
                  if re.search(r'function\s+\w*(?:Icon|Symbol)\w*\s*\(', line, re.I):
                      current_icon_helper = True
                      brace_depth = 0
                  if current_icon_helper:
                      brace_depth += line.count('{') - line.count('}')
                      def helper_sub(lm):
                          name = lm.group('name')
                          hits.append((str(path), name, replacements[name], 'helper'))
                          return f"{lm.group('q')}{replacements[name]}{lm.group('q')}"
                      lines[i] = literal_re.sub(helper_sub, lines[i])
                      if brace_depth <= 0 and '{' in ''.join(lines[max(0, i-2):i+1]):
                          current_icon_helper = False
              text = ''.join(lines)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('PATCHED ICON OCCURRENCES:')
          for path, old, new, kind in hits:
              print(f'  {path}: {old} -> {new} [{kind}]')
          print('\nCHANGED FILES:')
          for path in sorted(set(changed)):
              print(f'  {path}')

          # Global post-audit: targeted legacy identifiers must not remain in direct icon
          # properties/attributes or bound icon expressions anywhere under app/.
          residual = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              for m in direct_re.finditer(text):
                  if m.group('name') in replacements:
                      residual.append(f'{path}: direct {m.group("name")}')
              for m in bound_re.finditer(text):
                  for lm in literal_re.finditer(m.group('expr')):
                      residual.append(f'{path}: bound {lm.group("name")}')

          if residual:
              print('\nRESIDUAL TARGETED LEGACY ICON IDS:')
              print('\n'.join(residual))
              raise SystemExit(1)

          if not hits:
              raise SystemExit('No target legacy icon occurrences were found; refusing empty patch')

          print('\nTargeted legacy icon audit: CLEAN')
          PY

          git diff --check
          git diff -- app

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git rm .github/workflows/material-symbols-global-hotfix.yml
          git commit -m "fix(icons): replace reported legacy ids across app"
          git push origin HEAD:feat/material-symbols-migration
