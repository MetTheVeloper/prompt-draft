name: Temporary Wizard Definition Fold

on:
  push:
    branches:
      - feature/wizard

permissions:
  contents: write

jobs:
  fold:
    if: github.event.head_commit.message == 'chore(ci): fold portrait definition source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: feature/wizard
          fetch-depth: 0

      - name: Fold Pose options into canonical definition
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('app/wizard/definitionCore.ts')
          definition_path = Path('app/wizard/definition.ts')
          pose_options_path = Path('app/wizard/portraitPoseOptions.ts')

          text = core_path.read_text()
          import_line = 'import { portraitBackgroundOptionsQuestion } from "./portraitBackgroundOptions";\n'
          replacement_import = import_line + 'import { portraitPoseOptionsQuestion } from "./portraitPoseOptions";\n'
          if import_line not in text:
              raise SystemExit('background import anchor missing')
          text = text.replace(import_line, replacement_import, 1)

          pose_override_anchor = '''        {
                    id: "poseSubjectOverrides",
          '''
          # Preserve exact file indentation while inserting the normal modalOptions question.
          raw_anchor = '        {\n          id: "poseSubjectOverrides",\n'
          if raw_anchor not in text:
              raise SystemExit('pose override anchor missing')
          text = text.replace(
              raw_anchor,
              '        portraitPoseOptionsQuestion,\n' + raw_anchor,
              1,
          )

          old_description = '''          description:
                    "Keep the shared pose for everyone, or assign a different pose direction to individual people.",'''
          old_description = old_description.replace('                    ', '            ')
          new_description = '''          description:
                    "Keep the shared pose for everyone, or customize pose details for individual people.",'''
          new_description = new_description.replace('                    ', '            ')
          if old_description not in text:
              raise SystemExit('pose description anchor missing')
          text = text.replace(old_description, new_description, 1)

          shared_anchor = '          sharedIntentAnswerId: "poseIntent",\n          visibleWhen: {'
          if shared_anchor not in text:
              raise SystemExit('pose shared intent anchor missing')
          text = text.replace(
              shared_anchor,
              '          sharedIntentAnswerId: "poseIntent",\n          sharedOptionsAnswerId: "poseOptions",\n          visibleWhen: {',
              1,
          )

          definition_path.write_text(text)
          core_path.unlink()

          pose_text = pose_options_path.read_text().replace(
              'from "./definitionCore";',
              'from "./definition";',
              1,
          )
          pose_options_path.write_text(pose_text)
          PY

      - name: Commit folded definition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wizard/definition.ts app/wizard/definitionCore.ts app/wizard/portraitPoseOptions.ts
          git commit -m "refactor(wizard): fold pose options into definition"
          git push origin HEAD:feature/wizard
