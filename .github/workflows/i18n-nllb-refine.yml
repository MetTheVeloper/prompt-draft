name: Refine multilingual translations

on:
  push:
    branches:
      - feat/i18n-multilingual
    paths:
      - .github/workflows/i18n-nllb-refine.yml

permissions:
  contents: write

jobs:
  translate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh
            target_lang: zho_Hans
          - locale: ar
            target_lang: arb_Arab
          - locale: ru
            target_lang: rus_Cyrl
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export English source locale
        run: |
          npx --yes tsx@4.22.4 -e "import en from './i18n/locales/en.ts'; process.stdout.write(JSON.stringify(en))" > /tmp/en.json

      - name: Install NLLB runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.49.0" sentencepiece

      - name: Translate from canonical English locale
        env:
          TARGET_LOCALE: ${{ matrix.locale }}
          TARGET_LANG: ${{ matrix.target_lang }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import OrderedDict
          from pathlib import Path

          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          locale = os.environ['TARGET_LOCALE']
          target_lang = os.environ['TARGET_LANG']
          model_name = 'facebook/nllb-200-distilled-600M'

          with open('/tmp/en.json', encoding='utf-8') as fh:
              source = json.load(fh, object_pairs_hook=OrderedDict)

          # Keep interpolation variables, product/brand names, keyboard shortcuts,
          # file formats, model names and technical acronyms byte-for-byte.
          protected_re = re.compile(
              r'(\{[^{}]+\}|Prompt Draft|Ctrl/⌘ \+ V|WebM|iOS|iPhone|iPad|Safari|'
              r'gpt-image-1|DALL[·-]?E|JSON|SVG|PNG|JPG|JPEG|WEBP|GIF|AVIF|QR|PIP|'
              r'\b[A-Z][A-Z0-9]{1,}(?:[-+./][A-Z0-9]+)*\b)'
          )

          def split_protected(text):
              return protected_re.split(text)

          def is_protected(text):
              return bool(text) and protected_re.fullmatch(text) is not None

          def core_of(part):
              if not part or is_protected(part):
                  return None
              match = re.fullmatch(r'(\s*)(.*?)(\s*)', part, re.S)
              if not match:
                  return None
              core = match.group(2)
              return core if re.search(r'[A-Za-z]', core) else None

          unique = OrderedDict()

          def collect(value):
              if isinstance(value, str):
                  for part in split_protected(value):
                      core = core_of(part)
                      if core:
                          unique.setdefault(core, None)
              elif isinstance(value, dict):
                  for child in value.values():
                      collect(child)
              elif isinstance(value, list):
                  for child in value:
                      collect(child)

          collect(source)
          inputs = list(unique)
          print(f'{locale}: {len(inputs)} unique English segments')

          tokenizer = AutoTokenizer.from_pretrained(model_name, src_lang='eng_Latn')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()
          torch.set_num_threads(max(1, min(4, os.cpu_count() or 2)))

          target_id = tokenizer.convert_tokens_to_ids(target_lang)
          if target_id == tokenizer.unk_token_id:
              raise SystemExit(f'Unknown NLLB target language token: {target_lang}')

          translated = {}
          batch_size = 24

          with torch.inference_mode():
              for start in range(0, len(inputs), batch_size):
                  batch = inputs[start:start + batch_size]
                  encoded = tokenizer(
                      batch,
                      return_tensors='pt',
                      padding=True,
                      truncation=True,
                      max_length=384,
                  )
                  generated = model.generate(
                      **encoded,
                      forced_bos_token_id=target_id,
                      max_length=384,
                      num_beams=1,
                  )
                  output = tokenizer.batch_decode(generated, skip_special_tokens=True)
                  for original, result in zip(batch, output):
                      translated[original] = result.strip() or original

                  done = min(start + batch_size, len(inputs))
                  if done % 240 == 0 or done == len(inputs):
                      print(f'{locale}: {done}/{len(inputs)}')

          def rebuild(value):
              if isinstance(value, str):
                  rebuilt = []
                  for part in split_protected(value):
                      if is_protected(part):
                          rebuilt.append(part)
                          continue

                      match = re.fullmatch(r'(\s*)(.*?)(\s*)', part, re.S)
                      if not match:
                          rebuilt.append(part)
                          continue

                      lead, core, trail = match.groups()
                      rebuilt.append(f'{lead}{translated.get(core, core)}{trail}')
                  return ''.join(rebuilt)

              if isinstance(value, dict):
                  return OrderedDict((key, rebuild(child)) for key, child in value.items())
              if isinstance(value, list):
                  return [rebuild(child) for child in value]
              return value

          result = rebuild(source)

          # Curated user-facing terminology for navigation and common system actions.
          overrides = {
              'zh': {
                  'app.navigation.create': '创建',
                  'app.navigation.collage': '拼贴',
                  'app.navigation.guide': '指南',
                  'app.navigation.vectorizer': '矢量化',
                  'app.navigation.prompts': '提示词',
                  'app.switchTheme': '切换主题',
                  'app.switchLang': '切换语言',
                  'app.tools.menu': '更多工具',
                  'app.tools.convert': '转换',
                  'app.tools.about': '关于',
                  'validation.title': '需要注意',
                  'validation.level.error': '错误',
                  'validation.level.warning': '警告',
                  'pwa.offline.prompt.title': '离线使用 Prompt Draft',
                  'pwa.offline.prompt.updateTitle': '更新离线版本',
                  'pwa.offline.prompt.subtitle': '离线包',
                  'pwa.offline.prompt.action': '下载以供离线使用',
                  'pwa.offline.prompt.updateAction': '更新离线版本',
                  'pwa.offline.prompt.later': '暂不',
                  'pwa.offline.status.offlineMode': '当前处于离线模式。',
                  'pwa.offline.status.ready': '可供离线使用',
                  'pwa.offline.status.failed': '离线下载失败',
                  'pwa.offline.status.retry': '重试',
                  'pwa.install.android.title': '安装应用',
                  'pwa.install.android.action': '安装应用',
                  'pwa.install.ios.title': '在 iOS 设备上安装',
                  'pwa.install.ios.action': '知道了',
                  'pwa.install.actions.close': '关闭',
              },
              'ar': {
                  'app.navigation.create': 'إنشاء',
                  'app.navigation.collage': 'كولاج',
                  'app.navigation.guide': 'الدليل',
                  'app.navigation.vectorizer': 'تحويل إلى متجهات',
                  'app.navigation.prompts': 'المطالبات',
                  'app.switchTheme': 'تبديل السمة',
                  'app.switchLang': 'تبديل اللغة',
                  'app.tools.menu': 'المزيد من الأدوات',
                  'app.tools.convert': 'تحويل',
                  'app.tools.about': 'حول التطبيق',
                  'validation.title': 'يتطلب الانتباه',
                  'validation.level.error': 'خطأ',
                  'validation.level.warning': 'تحذير',
                  'pwa.offline.prompt.title': 'استخدام Prompt Draft دون اتصال',
                  'pwa.offline.prompt.updateTitle': 'تحديث النسخة المتاحة دون اتصال',
                  'pwa.offline.prompt.subtitle': 'حزمة العمل دون اتصال',
                  'pwa.offline.prompt.action': 'تنزيل للاستخدام دون اتصال',
                  'pwa.offline.prompt.updateAction': 'تحديث النسخة المتاحة دون اتصال',
                  'pwa.offline.prompt.later': 'ليس الآن',
                  'pwa.offline.status.offlineMode': 'أنت تستخدم وضع عدم الاتصال.',
                  'pwa.offline.status.ready': 'جاهز للاستخدام دون اتصال',
                  'pwa.offline.status.failed': 'فشل التنزيل للاستخدام دون اتصال',
                  'pwa.offline.status.retry': 'إعادة المحاولة',
                  'pwa.install.android.title': 'تثبيت التطبيق',
                  'pwa.install.android.action': 'تثبيت التطبيق',
                  'pwa.install.ios.title': 'التثبيت على جهاز iOS',
                  'pwa.install.ios.action': 'حسنًا',
                  'pwa.install.actions.close': 'إغلاق',
              },
              'ru': {
                  'app.navigation.create': 'Создать',
                  'app.navigation.collage': 'Коллаж',
                  'app.navigation.guide': 'Руководство',
                  'app.navigation.vectorizer': 'Векторизатор',
                  'app.navigation.prompts': 'Промпты',
                  'app.switchTheme': 'Сменить тему',
                  'app.switchLang': 'Сменить язык',
                  'app.tools.menu': 'Другие инструменты',
                  'app.tools.convert': 'Конвертировать',
                  'app.tools.about': 'О приложении',
                  'validation.title': 'Требует внимания',
                  'validation.level.error': 'Ошибка',
                  'validation.level.warning': 'Предупреждение',
                  'pwa.offline.prompt.title': 'Использовать Prompt Draft офлайн',
                  'pwa.offline.prompt.updateTitle': 'Обновить офлайн-версию',
                  'pwa.offline.prompt.subtitle': 'Офлайн-пакет',
                  'pwa.offline.prompt.action': 'Скачать для офлайн-работы',
                  'pwa.offline.prompt.updateAction': 'Обновить офлайн-версию',
                  'pwa.offline.prompt.later': 'Не сейчас',
                  'pwa.offline.status.offlineMode': 'Вы используете офлайн-режим.',
                  'pwa.offline.status.ready': 'Готово для офлайн-работы',
                  'pwa.offline.status.failed': 'Не удалось скачать офлайн-версию',
                  'pwa.offline.status.retry': 'Повторить',
                  'pwa.install.android.title': 'Установить приложение',
                  'pwa.install.android.action': 'Установить приложение',
                  'pwa.install.ios.title': 'Установить на устройство iOS',
                  'pwa.install.ios.action': 'Понятно',
                  'pwa.install.actions.close': 'Закрыть',
              },
          }

          def set_path(obj, dotted, value):
              node = obj
              parts = dotted.split('.')
              for part in parts[:-1]:
                  node = node[part]
              node[parts[-1]] = value

          for dotted, value in overrides[locale].items():
              set_path(result, dotted, value)

          output = Path(f'i18n/locales/{locale}.ts')
          output.write_text(
              'export default ' + json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          # Structural QA: same interpolation tokens as canonical English source.
          placeholder_re = re.compile(r'\{[^{}]+\}')
          def flatten(value, path=(), out=None):
              if out is None:
                  out = {}
              if isinstance(value, str):
                  out['.'.join(path)] = value
              elif isinstance(value, dict):
                  for key, child in value.items():
                      flatten(child, path + (key,), out)
              return out

          src = flatten(source)
          dst = flatten(result)
          if set(src) != set(dst):
              raise SystemExit(f'{locale}: locale key set changed')

          mismatches = []
          for key in src:
              a = sorted(placeholder_re.findall(src[key]))
              b = sorted(placeholder_re.findall(dst[key]))
              if a != b:
                  mismatches.append((key, a, b))

          if mismatches:
              print(*mismatches[:20], sep='\n')
              raise SystemExit(f'{locale}: {len(mismatches)} interpolation mismatches')

          print(f'{locale}: wrote {output} ({output.stat().st_size} bytes)')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: refined-${{ matrix.locale }}
          path: i18n/locales/${{ matrix.locale }}.ts
          if-no-files-found: error

  integrate:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i18n-multilingual
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - uses: actions/download-artifact@v4
        with:
          pattern: refined-*
          path: /tmp/locales
          merge-multiple: true

      - name: Replace translated locale files
        run: |
          cp /tmp/locales/zh.ts i18n/locales/zh.ts
          cp /tmp/locales/ar.ts i18n/locales/ar.ts
          cp /tmp/locales/ru.ts i18n/locales/ru.ts

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: |
          npx tsx - <<'TS'
          import en from './i18n/locales/en.ts'
          import zh from './i18n/locales/zh.ts'
          import ar from './i18n/locales/ar.ts'
          import ru from './i18n/locales/ru.ts'

          const flatten = (value: any, prefix = '', out: Record<string, string> = {}) => {
            for (const [key, child] of Object.entries(value)) {
              const path = prefix ? `${prefix}.${key}` : key
              if (typeof child === 'string') out[path] = child
              else if (child && typeof child === 'object') flatten(child, path, out)
            }
            return out
          }
          const source = flatten(en)
          const tokenRe = /\{[^{}]+\}/g
          for (const [code, messages] of Object.entries({ zh, ar, ru })) {
            const target = flatten(messages)
            if (Object.keys(target).length !== Object.keys(source).length) throw new Error(`${code}: key count mismatch`)
            for (const key of Object.keys(source)) {
              if (!(key in target)) throw new Error(`${code}: missing ${key}`)
              const a = [...(source[key].match(tokenRe) || [])].sort().join('|')
              const b = [...((target[key] || '').match(tokenRe) || [])].sort().join('|')
              if (a !== b) throw new Error(`${code}: interpolation mismatch at ${key}`)
            }
            console.log(`${code}: ${Object.keys(target).length} strings OK`)
          }
          TS
          pnpm generate

      - name: Commit refined translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/locales/zh.ts i18n/locales/ar.ts i18n/locales/ru.ts
          git rm .github/workflows/i18n-nllb-refine.yml
          git commit -m "fix(i18n): improve Chinese Arabic and Russian translations"
          git push origin HEAD:feat/i18n-multilingual
