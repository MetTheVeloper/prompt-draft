name: Material Symbols Final Verification

on:
  push:
    branches:
      - feat/material-symbols-migration

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate active icon source
        run: node scripts/material-symbols-final-validate.mjs

      - name: Generate application and offline manifest
        run: pnpm generate

      - name: Validate offline font coverage
        run: node scripts/material-symbols-final-validate.mjs --offline
