name: Material Symbols Migration

on:
  push:
    branches:
      - feat/material-symbols-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install temporary font source
        run: pnpm install --no-frozen-lockfile

      - name: Migrate active icon source
        run: node scripts/material-symbols-migrate.mjs

      - name: Vendor Material Symbols variable fonts
        run: |
          mkdir -p public/fonts/material-symbols
          cp node_modules/material-symbols/material-symbols-outlined.woff2 public/fonts/material-symbols/material-symbols-outlined.woff2
          cp node_modules/material-symbols/material-symbols-rounded.woff2 public/fonts/material-symbols/material-symbols-rounded.woff2
          cp node_modules/material-symbols/material-symbols-sharp.woff2 public/fonts/material-symbols/material-symbols-sharp.woff2

      - name: Remove temporary font package
        run: pnpm remove material-symbols

      - name: Verify lockfile
        run: pnpm install --frozen-lockfile

      - name: Refresh migration audit
        run: node scripts/material-symbols-audit.mjs

      - name: Validate generated application
        run: pnpm generate

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "refactor(icons): migrate active UI to Material Symbols [skip ci]"
          git push origin HEAD:feat/material-symbols-migration
