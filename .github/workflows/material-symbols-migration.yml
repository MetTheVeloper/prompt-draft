name: Material Symbols Migration Audit

on:
  push:
    branches:
      - feat/material-symbols-migration

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate icon inventory
        run: node scripts/material-symbols-audit.mjs

      - name: Commit audit output
        run: |
          if git diff --quiet -- .icon-migration-audit.json && git ls-files --error-unmatch .icon-migration-audit.json >/dev/null 2>&1; then
            echo "No audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .icon-migration-audit.json
          git commit -m "chore(icons): refresh migration audit [skip ci]"
          git push origin HEAD:feat/material-symbols-migration
