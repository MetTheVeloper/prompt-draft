name: Material Symbols Final Verification

on:
  push:
    branches:
      - feat/material-symbols-migration

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate active icon source
        run: |
          node scripts/material-symbols-final-validate.mjs
          if grep -RInE 'el-iconsax|Iconsax|vuesax|uiIcon|Material Icons|material-icons' app; then
            echo "Legacy icon-system reference found in active app source."
            exit 1
          fi

      - name: Generate application and offline manifest
        run: pnpm generate

      - name: Validate offline font coverage
        run: node scripts/material-symbols-final-validate.mjs --offline

      - name: Install Chromium
        run: npx --yes playwright@1.58.2 install --with-deps chromium

      - name: Capture desktop and mobile smoke screenshots
        run: |
          mkdir -p /tmp/material-symbols-smoke
          npx --yes serve@14.2.5 -s .output/public -l 4173 >/tmp/material-symbols-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="Desktop Chrome" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/create /tmp/material-symbols-smoke/create-desktop.png
          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="Desktop Chrome" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/prompts /tmp/material-symbols-smoke/prompts-desktop.png
          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="Desktop Chrome" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/collage /tmp/material-symbols-smoke/collage-desktop.png
          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="Desktop Chrome" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/guide /tmp/material-symbols-smoke/guide-desktop.png
          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="Desktop Chrome" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/vectorizer /tmp/material-symbols-smoke/vectorizer-desktop.png

          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="iPhone 13" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/create /tmp/material-symbols-smoke/create-mobile.png
          npx --yes playwright@1.58.2 screenshot --browser=chromium --device="iPhone 13" --full-page --wait-for-timeout=1500 http://127.0.0.1:4173/prompts /tmp/material-symbols-smoke/prompts-mobile.png

          cat /tmp/material-symbols-serve.log

      - name: Upload visual smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-symbols-smoke
          path: /tmp/material-symbols-smoke
          if-no-files-found: error
