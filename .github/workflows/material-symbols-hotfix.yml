name: Material Symbols reported hotfix

on:
  push:
    branches:
      - feat/material-symbols-migration
    paths:
      - .github/workflows/material-symbols-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Apply reported icon fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('app/components/Header.vue'): [
                  (
                      ":icon=\"t.theme.mode === 'dark' ? 'sun-1' : 'moon'\"",
                      ":icon=\"t.theme.mode === 'dark' ? 'light_mode' : 'dark_mode'\"",
                  ),
              ],
              Path('app/pages/collage.vue'): [
                  (
                      "return isPanelExpanded(panel) ? 'minus' : 'add'",
                      "return isPanelExpanded(panel) ? 'remove' : 'add'",
                  ),
                  (
                      ":icon=\"activeMode === 'video' ? 'video' : 'gallery'\"",
                      ":icon=\"activeMode === 'video' ? 'videocam' : 'image'\"",
                  ),
              ],
              Path('app/components/modules/panel/base.vue'): [
                  (
                      'if (isPrimaryCopied.value) return "tick";',
                      'if (isPrimaryCopied.value) return "check";',
                  ),
                  (
                      'return isLayoutModule.value ? "grid-5" : "document-copy";',
                      'return "content_copy";',
                  ),
                  (
                      ":icon=\"!isPanelExpanded ? 'arrow-down-1' : 'arrow-up'\"",
                      ":icon=\"!isPanelExpanded ? 'expand_more' : 'expand_less'\"",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- app/components/Header.vue app/pages/collage.vue app/components/modules/panel/base.vue

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/Header.vue app/pages/collage.vue app/components/modules/panel/base.vue
          git rm .github/workflows/material-symbols-hotfix.yml
          git commit -m "fix(icons): correct reported Material Symbols"
          git push origin HEAD:feat/material-symbols-migration
