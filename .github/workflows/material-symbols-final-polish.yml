name: Material Symbols final polish

on:
  push:
    branches:
      - feat/material-symbols-migration
    paths:
      - .github/workflows/material-symbols-final-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-symbols-migration
          fetch-depth: 0

      - name: Apply requested fixes and dynamic legacy sweep
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(path)

          patch('app/components/prompt/output-preview.vue', [
              ('return issue.level === "error" ? "danger" : "warning-2";', 'return issue.level === "error" ? "error" : "warning";'),
              (":icon=\"hasBlockingIssues ? 'danger' : 'warning-2'\"", ":icon=\"hasBlockingIssues ? 'error' : 'warning'\""),
              (":icon=\"output ? 'archive-tick' : 'document-text'\"", ":icon=\"output ? 'task_alt' : 'description'\""),
          ])

          patch('app/layouts/default.vue', [
              ('icon: locale.value === "fa" ? "en" : "fa",', 'icon: "language",'),
          ])

          header_path = Path('app/components/Header.vue')
          header = header_path.read_text(encoding='utf-8')
          header, count = re.subn(
              r'(<el-button\s+v-if="mobile"[\s\S]*?\bicon=")more_vert("[\s\S]*?@click="openMobileMenu")',
              r'\1menu\2',
              header,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one mobile more_vert button, found {count}')
          header_path.write_text(header, encoding='utf-8')

          for path in [
              'app/components/prompt/setup-panel.vue',
              'app/components/modules/panel/setup-panel.vue',
          ]:
              patch(path, [
                  ('return isPanelExpanded(panel) ? "remove" : "add";', 'return isPanelExpanded(panel) ? "expand_less" : "expand_more";'),
                  ('icon: expanded ? "remove" : "add",', 'icon: expanded ? "expand_less" : "expand_more",'),
              ])

          patch('app/pages/collage.vue', [
              ("return isPanelExpanded(panel) ? 'remove' : 'add'", "return isPanelExpanded(panel) ? 'expand_less' : 'expand_more'"),
          ])

          patch('app/components/modules/panel/base.vue', [
              ('icon: isPanelExpanded.value ? "remove" : "add",', 'icon: isPanelExpanded.value ? "expand_less" : "expand_more",'),
              (":icon=\"isGroupOpen(group) ? 'remove' : 'add'\"", ":icon=\"isGroupOpen(group) ? 'expand_less' : 'expand_more'\""),
              (":icon=\"activePresetId === preset.id ? 'check' : 'component'\"", ":icon=\"activePresetId === preset.id ? 'check' : 'widgets'\""),
              (":icon=\"!output ? 'danger' : 'archive-tick'\"", ":icon=\"!output ? 'error' : 'task_alt'\""),
          ])

          patch('app/components/el/Icon.vue', [
              ('variant: "outlined",', 'variant: "rounded",'),
          ])
          patch('docs/material-symbols.md', [
              ("variant = 'outlined'", "variant = 'rounded'"),
              ('default outlined/400 style', 'default rounded/400 style'),
          ])

          patch('app/composables/useModal.ts', [("'tick-circle'", "'check_circle'")])
          patch('app/components/prompt/SetupPanelContextMenu.vue', [
              ('"arrow-up"', '"expand_less"'),
              ('"arrow-down-1"', '"expand_more"'),
          ])
          patch('app/components/modules/panel/ModulePanelContextMenu.vue', [
              ('"arrow-up"', '"expand_less"'),
              ('"arrow-down-1"', '"expand_more"'),
              ('"close-circle"', '"cancel"'),
          ])
          patch('app/components/el/pwa.vue', [
              ("'refresh-2'", "'refresh'"),
              ("'cloud-add'", "'cloud_upload'"),
          ])
          patch('app/components/el/color-picker.vue', [
              ("'tick-circle'", "'check_circle'"),
              ("'close-circle'", "'cancel'"),
          ])
          patch('app/components/tools/ImageVectorizerPreview.vue', [("'refresh-circle'", "'refresh'")])
          patch('app/components/tools/ImageVectorizer.vue', [
              ("'maximize'", "'fullscreen'"),
              ("'forward-item'", "'first_page'"),
              ("'backward-item'", "'last_page'"),
              ("'path-square'", "'polyline'"),
          ])
          patch('app/components/prompts/PromptDetail.vue', [
              (":icon=\"copied ? 'tick-circle' : 'copy'\"", ":icon=\"copied ? 'check_circle' : 'content_copy'\""),
          ])

          for path in [
              'app/components/modules/panel/TextGroupsField.vue',
              'app/components/modules/variables/VariablesField.vue',
              'app/components/modules/layout/LayoutRegionsField.vue',
          ]:
              patch(path, [
                  ('"edit-2"', '"edit"'),
                  ('"add-circle"', '"add_circle"'),
                  ('"tick-circle"', '"check_circle"'),
              ])

          backup = Path('app/components/modules/panel/base.vue.before-layout-region-fix')
          if backup.exists():
              backup.unlink()
              print(f'deleted {backup}')
          PY

          if grep -RInE "['\"](warning-2|archive-tick|document-text|tick-circle|arrow-up|arrow-down-1|close-circle|edit-2|add-circle|refresh-2|cloud-add|refresh-circle|forward-item|backward-item|path-square)['\"]" app; then
            echo "Residual distinctive legacy icon id found"
            exit 1
          fi

          if grep -RInE "icon.*['\"](danger|archive-tick|copy|component|maximize)['\"]" app --include='*.vue' --include='*.ts'; then
            echo "Residual ambiguous legacy icon id found in icon context"
            exit 1
          fi

          node scripts/material-symbols-final-validate.mjs
          git diff --check
          git diff -- app docs/material-symbols.md

      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app docs/material-symbols.md
          git rm .github/workflows/material-symbols-final-polish.yml
          git commit -m "fix(icons): finish Material Symbols polish"
          git push origin HEAD:feat/material-symbols-migration
